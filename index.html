<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pupicontrol — Fase de Pruebas</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
--primary:#4f46e5;
--accent:#10b981;
--bg:#f8fafc;
--card:#ffffff;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
margin:0;
padding:20px;
}

/* HERO */
.hero{
background:linear-gradient(135deg,#4f46e5,#3b82f6);
color:white;
text-align:center;
padding:60px 20px;
border-radius:20px;
animation:fadeDown 1s ease;
}

@keyframes fadeDown{
from{opacity:0;transform:translateY(-40px);}
to{opacity:1;transform:translateY(0);}
}

.hero img{
width:100px;
border-radius:20px;
}

/* CONTENIDO */
.container{
max-width:900px;
margin:auto;
}

.card{
background:var(--card);
padding:30px;
margin-top:20px;
border-radius:16px;
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
box-shadow:0 20px 40px rgba(0,0,0,.1);
}

/* BOTONES */
.btn{
display:inline-block;
padding:14px 24px;
border-radius:30px;
color:white;
text-decoration:none;
margin:10px;
font-weight:600;
position:relative;
overflow:hidden;
}

.btn-play{background:var(--accent);}
.btn-youtube{background:#ff0000;}

.btn::after{
content:"";
position:absolute;
width:200%;
height:200%;
background:radial-gradient(circle,rgba(255,255,255,.4)10%,transparent 40%);
top:-50%;
left:-50%;
opacity:0;
transition:.4s;
}

.btn:hover::after{opacity:1;}

/* REVEAL SCROLL */
.reveal{
opacity:0;
transform:translateY(40px);
transition:.8s;
}

.reveal.active{
opacity:1;
transform:translateY(0);
}

/* YOUTUBE */
iframe{
width:100%;
height:320px;
border-radius:12px;
}

/* FOOTER */
footer{
text-align:center;
margin-top:40px;
font-size:.9rem;
}
footer a{
color:var(--primary);
text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

<!-- HERO -->
<div class="hero">
<img src="splash.png">
<h1>Pupicontrol</h1>
<p>Fase de pruebas exclusiva</p>
</div>

<!-- INTRO -->
<div class="card reveal">
<h2>Únete como tester</h2>
<p>Explora la app antes del lanzamiento oficial.</p>
</div>

<!-- CTA -->
<div class="card reveal">
<h3>Empieza ahora</h3>

<a href="https://play.google.com/store/apps/details?id=com.moonforgeapp" target="_blank" class="btn btn-play">
<i class="fa-brands fa-google-play"></i> Probar App
</a>

<a href="https://www.youtube.com/@PupiControl" target="_blank" class="btn btn-youtube">
<i class="fa-brands fa-youtube"></i> Canal YouTube
</a>

</div>

<!-- YOUTUBE -->
<div class="card reveal">
<h3>Guías en vídeo</h3>
<iframe src="https://www.youtube.com/embed?listType=user_uploads&list=PupiControl"></iframe>
</div>

<!-- FOOTER -->
<footer>
<p>&copy; 2026 Pupicontrol</p>
<p>
<a href="https://sites.google.com/d/1lGjclx83k327klVsFj5UtXp0lv_i4RXv/p/1VAaqWkdM15VbWRinJOM21hkshco_QkpR/edit" target="_blank">
Política de privacidad
</a>
</p>
</footer>

</div>

<script>

/* SCROLL ANIMATION */
function reveal(){
const elements=document.querySelectorAll(".reveal");
elements.forEach(el=>{
const windowHeight=window.innerHeight;
const elementTop=el.getBoundingClientRect().top;
if(elementTop<windowHeight-100){
el.classList.add("active");
}
});
}

window.addEventListener("scroll",reveal);
reveal();

</script>

</body>
</html>
