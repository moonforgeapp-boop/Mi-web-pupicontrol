<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pupicontrol — Fase de Pruebas y Novedades Exclusivas</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --accent: #10b981;
            --dark: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            padding: 20px;
        }

        .landing-wrapper {
            max-width: 800px;
            margin: auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
        }

        .hero-banner {
            background: linear-gradient(135deg,#4f46e5,#3b82f6);
            color: white;
            text-align: center;
            padding: 40px;
        }

        .app-logo {
            width: 100px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .content-body {
            padding: 30px;
        }

        .headline {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .carousel img {
            width: 100%;
            border-radius: 10px;
        }

        .cta-section {
            background: var(--primary-light);
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            margin: 10px;
            padding: 14px 22px;
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-weight: 600;
        }

        .btn-play {
            background: var(--accent);
        }

        .btn-youtube {
            background: #ff0000;
        }

        .youtube-section {
            margin-top: 40px;
            text-align: center;
        }

        .youtube-section iframe {
            width: 100%;
            height: 300px;
            border-radius: 12px;
        }

        .footer {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="landing-wrapper">

    <header class="hero-banner">
        <img src="splash.png" class="app-logo">
        <h1>Pupicontrol</h1>
        <p>Edición especial • Pruebas exclusivas</p>
    </header>

    <main class="content-body">

        <h2 class="headline">Únete a la fase de pruebas</h2>
        <p>Explora la app antes de su lanzamiento oficial.</p>

        <div class="carousel">
            <img src="1.jpg">
        </div>

        <!-- CTA -->
        <div class="cta-section">
            <h3>Participa como tester</h3>

            <a href="https://play.google.com/store/apps/details?id=com.moonforgeapp" 
               class="btn btn-play" target="_blank">
               <i class="fa-brands fa-google-play"></i> Probar App
            </a>

            <a href="https://www.youtube.com/@PupiControl" 
               class="btn btn-youtube" target="_blank">
               <i class="fa-brands fa-youtube"></i> Canal YouTube
            </a>
        </div>

        <!-- YouTube -->
        <div class="youtube-section">
            <h3>Guías en vídeo</h3>

            <iframe src="https://www.youtube.com/embed?listType=user_uploads&list=PupiControl"></iframe>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Pupicontrol</p>

            <p>
                <a href="https://sites.google.com/d/1lGjclx83k327klVsFj5UtXp0lv_i4RXv/p/1VAaqWkdM15VbWRinJOM21hkshco_QkpR/edit" target="_blank">
                    Política de privacidad
                </a>
            </p>
        </footer>

    </main>

</div>

</body>
</html>
